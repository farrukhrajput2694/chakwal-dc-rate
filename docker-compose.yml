services:
  web:
    build: .
    # Published on localhost only. Reaching it from the internet should go
    # through a TLS-terminating reverse proxy (Caddy, nginx, Caddy + a tunnel),
    # not by exposing this port raw to the world.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Leave empty: the page and the API are the same origin, so CORS is not
      # needed. Only set this if you deliberately split the frontend onto
      # another host -- which also opens the API to that host's users.
      RATE_APP_CORS_ORIGINS: ""
      # A wall-clock time in PAKISTAN time, not the host's local time, so the
      # value is the same on a Pakistan laptop, a UTC Render container and a UTC
      # VPS. 0 is midnight in Chakwal. This used to read "05:00 on UTC is
      # midnight in Chakwal", which was wrong twice over: the value is not
      # host-local, and 05:00 Pakistan time is 5am, not midnight. See the
      # REFRESH_HOUR block in app.py and RATE_APP_REFRESH_HOUR in .env.example.
      RATE_APP_REFRESH_HOUR: "0"
    restart: unless-stopped
